# Один процесс приложения + Postgres(pgvector). Фото — локально на диске (том media).
# Никаких очередей/балансировщиков — простейшее работающее окружение (§10.2).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aifashion
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aifashion"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/aifashion
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_DIR: /app/data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media   # фото переживают перезапуск контейнера
    command: >
      sh -c "alembic upgrade head && python -m aifashion.main"

volumes:
  db_data:
  media_data:
